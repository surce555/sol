name: 🚀 Build & Publish APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: 🔨 Build APK & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 📋 Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 计算版本号 ──────────────────────────────
      - name: 🔢 Compute version
        id: ver
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date +'%Y%m%d')
          COMMIT_COUNT=$(git rev-list --count HEAD)

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER_NAME="${GITHUB_REF#refs/tags/}"
            IS_PRERELEASE=false
          else
            VER_NAME="nightly-${DATE}-${SHORT_SHA}"
            IS_PRERELEASE=true
          fi

          echo "ver_name=$VER_NAME"           >> $GITHUB_OUTPUT
          echo "ver_code=$COMMIT_COUNT"        >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA"          >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE"  >> $GITHUB_OUTPUT
          echo "📦 Version: $VER_NAME (code: $COMMIT_COUNT)"

      # ── 可选：签名 keystore ───────────────────
      - name: 🔑 Decode keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "✅ Keystore ready."
          else
            echo "ℹ️  No keystore — APK will be unsigned."
          fi

      # ── 编译 Release APK ──────────────────────
      - name: 🏗️ Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "app/release.keystore" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=release.keystore \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            ./gradlew assembleRelease
          fi

      # ── 也编译 Debug APK（可选下载用）────────
      - name: 🏗️ Build Debug APK
        run: ./gradlew assembleDebug

      # ── 重命名，加入版本号 ────────────────────
      - name: ✏️ Rename APKs
        id: apk
        run: |
          VER="${{ steps.ver.outputs.ver_name }}"

          REL=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          DBG=$(find app/build/outputs/apk/debug   -name "*.apk" | head -1)

          REL_OUT="SOLTracker-${VER}-release.apk"
          DBG_OUT="SOLTracker-${VER}-debug.apk"

          mv "$REL" "$REL_OUT"
          mv "$DBG" "$DBG_OUT"

          echo "release_apk=$REL_OUT" >> $GITHUB_OUTPUT
          echo "debug_apk=$DBG_OUT"   >> $GITHUB_OUTPUT
          echo "✅ Release APK: $REL_OUT"
          echo "✅ Debug   APK: $DBG_OUT"
          ls -lh *.apk

      # ── 上传 APK 到 GitHub Actions Artifacts（始终备份） ──
      - name: 📦 Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SOLTracker-APKs-${{ steps.ver.outputs.ver_name }}
          path: "*.apk"
          retention-days: 30

      # ── 使用官方 gh CLI 发布 Release（解决 third-party action tag conflict 错误）──
      - name: 🚀 Publish Release via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_PRERELEASE: ${{ steps.ver.outputs.is_prerelease }}
          VER_NAME: ${{ steps.ver.outputs.ver_name }}
          REL_APK: ${{ steps.apk.outputs.release_apk }}
          DBG_APK: ${{ steps.apk.outputs.debug_apk }}
          SHORT_SHA: ${{ steps.ver.outputs.short_sha }}
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            TAG="latest"
            TITLE="🌙 SOL Tracker Nightly · $VER_NAME"
            BODY=$(cat <<EOF
          ## 🌙 Nightly 自动构建

          | 字段 | 值 |
          |------|---|
          | 📅 构建时间 | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |
          | 🔖 Commit | $SHORT_SHA |

          ### 📱 安装说明
          1. 下载下方 **SOLTracker-*-release.apk**（推荐）
          2. 手机开启「允许安装未知来源应用」后安装

          ### ✨ 功能特性
          - 📊 SOL/USDT 实时价格（Binance WebSocket 毫秒级推送）
          - 📈 多周期K线图：1H / 4H / 日K / 周K / 月K + 成交量柱状图
          - 📐 MA7 / MA25 / MA99 均线
          - 📖 买卖深度盘口 Top 5
          - 🔔 价格突破/跌破通知提醒
          - 🌙 深色主题（Solana 品牌配色）

          > ⚠️ Nightly 为主分支自动化编译包，稳定版请查看正式 Release。
          EOF
          )

            # 如果 latest release 已存在，使用 --clobber 直接覆盖上传文件；如果不存在则新建
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release '$TAG' already exists. Updating release notes and overwriting APK files..."
              gh release edit "$TAG" --title "$TITLE" --notes "$BODY" --prerelease
              gh release upload "$TAG" "$REL_APK" "$DBG_APK" --clobber
            else
              echo "Creating new release '$TAG'..."
              gh release create "$TAG" "$REL_APK" "$DBG_APK" --title "$TITLE" --notes "$BODY" --prerelease
            fi
            echo "✅ Nightly release updated successfully!"

          else
            TAG="$VER_NAME"
            TITLE="🪙 SOL Tracker $VER_NAME"
            BODY=$(cat <<EOF
          ## 🪙 SOL Tracker $VER_NAME

          ### 📦 下载
          | APK | 说明 |
          |-----|------|
          | \`$REL_APK\` | ✅ 推荐，混淆优化，体积小 |
          | \`$DBG_APK\` | 🔧 调试版 |

          ### 📱 安装方式
          1. 下载 release APK
          2. Android → 设置 → 安全 → 开启「允许未知来源」
          3. 打开 APK 完成安装

          ### ✨ 功能特性
          - 📊 实时价格（Binance WebSocket）
          - 📈 K线图：1H / 4H / 日K / 周K / 月K
          - 📉 成交量柱 + MA7/MA25/MA99
          - 📖 深度盘口 Top 5
          - 🔔 价格提醒推送
          - 🌙 Solana 深色主题
          EOF
          )

            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --title "$TITLE" --notes "$BODY"
              gh release upload "$TAG" "$REL_APK" "$DBG_APK" --clobber
            else
              gh release create "$TAG" "$REL_APK" "$DBG_APK" --title "$TITLE" --notes "$BODY"
            fi
            echo "✅ Versioned release created successfully!"
          fi
