name: 🚀 Build & Publish APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: 🔨 Build APK & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 📋 Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 计算版本号 ──────────────────────────────
      - name: 🔢 Compute version
        id: ver
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date +'%Y%m%d')
          COMMIT_COUNT=$(git rev-list --count HEAD)

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER_NAME="${GITHUB_REF#refs/tags/}"
          else
            VER_NAME="v1.0.0-${SHORT_SHA}"
          fi

          echo "ver_name=$VER_NAME"           >> $GITHUB_OUTPUT
          echo "ver_code=$COMMIT_COUNT"        >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA"          >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE"  >> $GITHUB_OUTPUT
          echo "📦 Version: $VER_NAME (code: $COMMIT_COUNT)"

      # ── 可选：签名 keystore ───────────────────
      - name: 🔑 Decode keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "✅ Keystore ready."
          else
            echo "ℹ️  No keystore — APK will be unsigned."
          fi

      # ── 编译 Release APK ──────────────────────
      - name: 🏗️ Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "app/release.keystore" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=release.keystore \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            ./gradlew assembleRelease
          fi

      # ── 也编译 Debug APK（可选下载用）────────
      - name: 🏗️ Build Debug APK
        run: ./gradlew assembleDebug

      # ── 重命名，加入版本号 ────────────────────
      - name: ✏️ Rename APKs
        id: apk
        run: |
          VER="${{ steps.ver.outputs.ver_name }}"

          REL=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          DBG=$(find app/build/outputs/apk/debug   -name "*.apk" | head -1)

          REL_OUT="SOLTracker-${VER}-release.apk"
          DBG_OUT="SOLTracker-${VER}-debug.apk"

          mv "$REL" "$REL_OUT"
          mv "$DBG" "$DBG_OUT"

          echo "release_apk=$REL_OUT" >> $GITHUB_OUTPUT
          echo "debug_apk=$DBG_OUT"   >> $GITHUB_OUTPUT
          echo "✅ Release APK: $REL_OUT"
          echo "✅ Debug   APK: $DBG_OUT"
          ls -lh *.apk

      # ── 上传 APK 到 GitHub Actions Artifacts（始终备份） ──
      - name: 📦 Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SOLTracker-APKs-${{ steps.ver.outputs.ver_name }}
          path: "*.apk"
          retention-days: 30

      # ── 使用官方 gh CLI 发布公开 Release ──
      - name: 🚀 Publish Public Release via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER_NAME: ${{ steps.ver.outputs.ver_name }}
          REL_APK: ${{ steps.apk.outputs.release_apk }}
          DBG_APK: ${{ steps.apk.outputs.debug_apk }}
        run: |
          TAG="${VER_NAME}"
          TITLE="🪙 SOL Tracker ${VER_NAME}"
          BODY=$(cat <<EOF
          ## 🪙 SOL Tracker ${VER_NAME} (Android APK)

          ### 📦 直接下载安装包
          - ⬇️ **[推荐下载] 优化正式版：\`${REL_APK}\`**
          - ⬇️ **[备用下载] 调试日志版：\`${DBG_APK}\`**

          ### 📱 安装方式
          1. 点击下方 Assets 区域的 \`${REL_APK}\` 下载到安卓手机
          2. 打开文件，开启「允许安装未知来源应用」
          3. 点击安装即可启动运行

          ### ✨ 核心功能
          - 📊 **实时价格**：Binance WebSocket 毫秒级推流
          - 📈 **多周期K线**：1小时、4小时、日K、周K、月K线图
          - 📉 **成交量图**：与K线联动，牛红熊绿
          - 📐 **均线指标**：MA7 / MA25 / MA99
          - 📖 **深度盘口**：买卖盘 Top 5 挂单实时监控
          - 🔔 **价格提醒**：自定义突破/跌破通知推送
          - 🌙 **深色主题**：Solana 原生品牌配色设计
          EOF
          )

          # 如果 release 已经存在，更新内容并覆盖上传 APK；否则新建并设为 latest
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release '$TAG' exists. Updating..."
            gh release edit "$TAG" --title "$TITLE" --notes "$BODY" --latest
            gh release upload "$TAG" "$REL_APK" "$DBG_APK" --clobber
          else
            echo "Creating new release '$TAG'..."
            gh release create "$TAG" "$REL_APK" "$DBG_APK" --title "$TITLE" --notes "$BODY" --latest
          fi
          echo "✅ Release successfully published and marked as Latest!"

