name: 🚀 Build & Release SOL Tracker APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: 🔨 Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 📋 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🔍 Run lint checks
        run: ./gradlew lint --continue

      - name: 🧪 Run unit tests
        run: ./gradlew test

      - name: 🏗️ Build Debug APK
        run: ./gradlew assembleDebug

      - name: 📦 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sol-tracker-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  release:
    name: 🎉 Build Release APK
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 📋 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🔑 Decode Keystore (if signing configured)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: 🏗️ Build Release APK
        run: |
          if [ -f "app/release.keystore" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=release.keystore \
              -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
              -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
              -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
          else
            ./gradlew assembleRelease
          fi

      - name: 📦 Get APK info
        id: apk_info
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $APK_PATH)" >> $GITHUB_OUTPUT

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SOL Tracker ${{ github.ref_name }}
          body: |
            ## 🪙 SOL Tracker ${{ github.ref_name }}
            
            **Solana 虚拟币价格监控工具**
            
            ### ✨ 功能特性
            - 📊 实时 SOL/USDT 价格 (Binance WebSocket)
            - 📈 K线图: 1H / 4H / 日K / 周K / 月K
            - 📉 成交量柱状图 + MA7/MA25/MA99 均线
            - 🔔 自定义价格提醒 (推送通知)
            - 📖 买卖深度盘口
            - 🌙 深色/浅色主题
            
            ### 📱 安装方式
            下载 APK 文件，在 Android 设备上开启「允许未知来源」后安装。
            
            ### ⚠️ 免责声明
            本工具仅供行情参考，不构成投资建议。
          files: ${{ steps.apk_info.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
