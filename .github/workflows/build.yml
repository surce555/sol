name: 🚀 Build & Publish APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: 🔨 Build APK & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 📋 Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 计算版本号 ──────────────────────────────
      - name: 🔢 Compute version
        id: ver
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date +'%Y%m%d')
          COMMIT_COUNT=$(git rev-list --count HEAD)

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER_NAME="${GITHUB_REF#refs/tags/}"
            IS_PRERELEASE=false
          else
            VER_NAME="nightly-${DATE}-${SHORT_SHA}"
            IS_PRERELEASE=true
          fi

          echo "ver_name=$VER_NAME"           >> $GITHUB_OUTPUT
          echo "ver_code=$COMMIT_COUNT"        >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA"          >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE"  >> $GITHUB_OUTPUT
          echo "📦 Version: $VER_NAME (code: $COMMIT_COUNT)"

      # ── 可选：签名 keystore ───────────────────
      - name: 🔑 Decode keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "✅ Keystore ready."
          else
            echo "ℹ️  No keystore — APK will be unsigned."
          fi

      # ── 编译 Release APK ──────────────────────
      - name: 🏗️ Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "app/release.keystore" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=release.keystore \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            ./gradlew assembleRelease
          fi

      # ── 也编译 Debug APK（可选下载用）────────
      - name: 🏗️ Build Debug APK
        run: ./gradlew assembleDebug

      # ── 重命名，加入版本号 ────────────────────
      - name: ✏️ Rename APKs
        id: apk
        run: |
          VER="${{ steps.ver.outputs.ver_name }}"

          REL=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          DBG=$(find app/build/outputs/apk/debug   -name "*.apk" | head -1)

          REL_OUT="SOLTracker-${VER}-release.apk"
          DBG_OUT="SOLTracker-${VER}-debug.apk"

          mv "$REL" "$REL_OUT"
          mv "$DBG" "$DBG_OUT"

          echo "release_apk=$REL_OUT" >> $GITHUB_OUTPUT
          echo "debug_apk=$DBG_OUT"   >> $GITHUB_OUTPUT
          echo "✅ Release APK: $REL_OUT"
          echo "✅ Debug   APK: $DBG_OUT"
          ls -lh *.apk

      # ── Nightly: push main → 更新 latest 预发布 ──
      - name: 🗑️ Delete old latest release
        if: steps.ver.outputs.is_prerelease == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest --yes --cleanup-tag 2>/dev/null || true

      - name: 🌙 Publish Nightly (latest pre-release)
        if: steps.ver.outputs.is_prerelease == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "🌙 SOL Tracker Nightly · ${{ steps.ver.outputs.ver_name }}"
          prerelease: true
          make_latest: false
          body: |
            ## 🌙 Nightly 自动构建

            | 字段 | 值 |
            |------|---|
            | 📅 构建时间 | ${{ github.event.head_commit.timestamp }} |
            | 🔖 Commit | [`${{ steps.ver.outputs.short_sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
            | 💬 提交信息 | ${{ github.event.head_commit.message }} |

            ### 📱 安装说明
            1. 下载 **SOLTracker-*-release.apk**（推荐）
            2. 手机开启「允许安装未知来源应用」后安装

            ### ✨ 功能
            - 📊 SOL/USDT 实时价格（Binance WebSocket 推送）
            - 📈 K线图：1H / 4H / 日K / 周K / 月K + 成交量柱
            - 📐 MA7 / MA25 / MA99 均线
            - 📖 买卖深度盘口 Top 5
            - 🔔 价格突破/跌破提醒（推送通知）
            - 🌙 深色主题（Solana 品牌色）

            > ⚠️ Nightly 为自动构建，非正式版本。稳定版请看 [Releases](../../releases)。
          files: |
            ${{ steps.apk.outputs.release_apk }}
            ${{ steps.apk.outputs.debug_apk }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Versioned: push tag v* → 正式发布 ────
      - name: 📝 Generate changelog
        if: steps.ver.outputs.is_prerelease == 'false'
        id: changelog
        run: |
          TAG="${{ github.ref_name }}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            LOG=$(git log "${PREV}..${TAG}" --pretty=format:"- %s ([%h](${{ github.server_url }}/${{ github.repository }}/commit/%H))" | head -50)
          else
            LOG=$(git log --pretty=format:"- %s ([%h](${{ github.server_url }}/${{ github.repository }}/commit/%H))" | head -20)
          fi
          { echo 'log<<EOF'; echo "$LOG"; echo 'EOF'; } >> $GITHUB_OUTPUT

      - name: 🎉 Publish Versioned Release
        if: steps.ver.outputs.is_prerelease == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "🪙 SOL Tracker ${{ github.ref_name }}"
          prerelease: false
          make_latest: true
          body: |
            ## 🪙 SOL Tracker ${{ github.ref_name }}

            ### 📦 下载
            | APK | 说明 |
            |-----|------|
            | `SOLTracker-*-release.apk` | ✅ 推荐，混淆优化，体积小 |
            | `SOLTracker-*-debug.apk`   | 🔧 调试版 |

            ### 📋 本版本更新
            ${{ steps.changelog.outputs.log }}

            ### 📱 安装方式
            1. 下载 `release` APK
            2. Android → 设置 → 安全 → 开启「允许未知来源」
            3. 安装 APK

            ### ✨ 功能特性
            - 📊 实时价格（Binance WebSocket）
            - 📈 K线图：1H / 4H / 日K / 周K / 月K
            - 📉 成交量柱 + MA7/MA25/MA99
            - 📖 深度盘口 Top 5
            - 🔔 价格提醒推送
            - 🌙 Solana 深色主题

            > ⚠️ 仅供行情参考，不构成投资建议。
          files: |
            ${{ steps.apk.outputs.release_apk }}
            ${{ steps.apk.outputs.debug_apk }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
