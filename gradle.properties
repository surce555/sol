# Project-wide Gradle settings.
# https://docs.gradle.org/current/userguide/build_environment.html

# AndroidX: required for all modern Android projects
android.useAndroidX=true

# Jetifier: migrates legacy support library dependencies to AndroidX
android.enableJetifier=true

# Kotlin code style
kotlin.code.style=official

# Enables incremental compilation
kotlin.incremental=true

# JVM target for Kotlin
kotlin.jvm.target.validation.mode=warning

# Gradle daemon JVM args
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable parallel builds
org.gradle.parallel=true

# Enable Gradle build cache
org.gradle.caching=true

# Enable configuration cache (speeds up builds)
org.gradle.configuration-cache=true
